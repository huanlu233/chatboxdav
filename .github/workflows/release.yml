name: Upstream sync and Android release
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['webdav-module/**', 'integration/**', 'scripts/**', 'upstream.json', 'distribution.json', '.github/workflows/release.yml', 'tests/**']
concurrency:
  group: chatboxdav-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      needed: ${{ steps.candidate.outputs.needed }}
      version: ${{ steps.candidate.outputs.version }}
      upstream_changed: ${{ steps.candidate.outputs.upstream_changed }}
      previous_tag: ${{ steps.candidate.outputs.previous_tag }}
      previous_commit: ${{ steps.candidate.outputs.previous_commit }}
    env:
      CI: 'true'
      HUSKY: '0'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: candidate
        name: Select next stable upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ github.event_name != 'schedule' }}
        run: node scripts/update-upstream.mjs
      - uses: pnpm/action-setup@v4
        if: steps.candidate.outputs.needed == 'true'
        with:
          version: '10.33.0'
      - uses: actions/setup-java@v4
        if: steps.candidate.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: steps.candidate.outputs.needed == 'true'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        if: steps.candidate.outputs.needed == 'true'
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble pristine upstream with WebDAV extension
        if: steps.candidate.outputs.needed == 'true'
        run: |
          node scripts/prepare.mjs
          node scripts/install-electron.mjs
      - name: Validate tests, upstream contracts and APK
        id: checks
        if: steps.candidate.outputs.needed == 'true'
        continue-on-error: true
        shell: bash
        run: node scripts/validate.mjs 2>&1 | tee .build/check.log
      - name: Verify source ownership and upstream integrity
        if: steps.candidate.outputs.needed == 'true'
        run: |
          git diff --exit-code -- scripts tests .github distribution.json package.json LICENSE
          node scripts/verify-upstream.mjs
      - name: Block failed validation
        if: steps.checks.outcome == 'failure'
        run: |
          echo 'Validation failed; release blocked.'
          exit 1
      - name: Record reproducible sources
        if: steps.candidate.outputs.needed == 'true'
        run: |
          git add -N -- integration/plugin.mjs integration/renderer webdav-module/src webdav-module/android/src
          git diff --binary > dist/candidate.patch
          git -C .build/upstream archive --format=tar.gz -o ../../dist/chatbox-upstream-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: steps.candidate.outputs.needed == 'true'
        with:
          name: verified-build
          path: dist/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-diagnostics
          path: .build/check.log
  publish:
    needs: build
    if: needs.build.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: verified-build
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;35.0.0'
      - name: Sign in a clean runner with a stable private key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing persistent release signing secrets'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_KEYSTORE"
          trap 'rm -f "$SIGNING_KEYSTORE"' EXIT
          node scripts/sign.mjs
      - name: Apply only verified WebDAV changes and pin
        run: node scripts/publish-source.mjs
      - name: Publish verified APK and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          UPSTREAM_CHANGED: ${{ needs.build.outputs.upstream_changed }}
          UPSTREAM_PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
          UPSTREAM_PREVIOUS_COMMIT: ${{ needs.build.outputs.previous_commit }}
        run: node scripts/release.mjs
  report:
    needs: [build, publish]
    if: always() && (needs.build.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Report blocked release without modifying upstream
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          count=$(gh issue list --state open --search 'ChatboxDAV release blocked in:title' --json number --jq length)
          if [ "$count" = '0' ]; then gh issue create --title 'ChatboxDAV release blocked' --body "Tests, compatibility, signing or publication failed. Upstream core was not patched. Details: $RUN_URL"; fi
